name: Release

# CD: push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to
# test, build a release APK + Play Store AAB + web bundle, and publish them as
# a GitHub Release with auto-generated notes.
#
# Signing (optional): add these repository secrets to sign with your own key.
# Without them the build is signed with the debug key (fine for testing, not for the Play Store).
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.2.0 (tag v<version> is created)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ github.event.inputs.version }}"
          else
            name="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - release is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK and App Bundle
        run: |
          flutter build apk --release --build-name ${{ steps.version.outputs.name }} --build-number ${{ steps.version.outputs.build }}
          flutter build appbundle --release --build-name ${{ steps.version.outputs.name }} --build-number ${{ steps.version.outputs.build }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/lume-${{ steps.version.outputs.tag }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/lume-${{ steps.version.outputs.tag }}.aab

      - name: Build web bundle
        run: |
          flutter build web --release --no-wasm-dry-run
          (cd build/web && zip -qr "../../dist/lume-web-${{ steps.version.outputs.tag }}.zip" .)

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lumé ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ startsWith(steps.version.outputs.name, '0.') }}
          files: dist/*

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
