name: 🐞 Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Discover
        2. Swipe right twice quickly
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Both]
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: API mode
      options: [Mock API, Real backend]
  - type: input
    id: device
    attributes:
      label: Device / OS version
      placeholder: Pixel 7, Android 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
