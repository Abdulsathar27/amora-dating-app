name: ✨ Feature request
description: Suggest an idea for Amora
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Discover, Likes, Matches & chat, Us (relationship), Profile, Onboarding, Backend API, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
